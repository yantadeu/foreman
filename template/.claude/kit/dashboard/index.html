<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foreman</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' aria-hidden='true'%3E%3Crect x='10' y='23' width='44' height='34' rx='10' fill='%23121826' stroke='%23f5a524' stroke-width='3'/%3E%3Cpath d='M7 27h50a2.5 2.5 0 0 0 0-5h-3.5C53.5 11.5 44 4 32 4S10.5 11.5 10.5 22H7a2.5 2.5 0 0 0 0 5z' fill='%23f5a524'/%3E%3Crect x='28.5' y='4.5' width='7' height='16' rx='2.5' fill='%23c97f00'/%3E%3Crect x='16' y='32' width='32' height='15' rx='5' fill='%23070b14'/%3E%3Cpath d='M19 40h6l3-5.5 4.5 11 3-5.5h9.5' fill='none' stroke='%234cc9f0' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='24' y='50' width='16' height='3' rx='1.5' fill='%23f5a524' opacity='.55'/%3E%3C/svg%3E">
<style>
  /* Foreman: a control room. Dark by default; the theme button switches to light. */
  :root { --bg:#070a12; --card:#0d121d; --card2:#111827; --fg:#d7dee9; --mute:#7d8aa0; --line:#1e2738; --sel:#141c2b;
          --run:#4cc9f0; --ok:#3ddc97; --bad:#ff6b6b; --warn:#f5a524; --accent:#f5a524; --floor:#0b1120; --floor2:#0e1527;
          --glow:0 0 0 1px rgba(245,165,36,.35), 0 0 24px rgba(245,165,36,.12);
          --mono:"JetBrains Mono","SF Mono","Cascadia Code",Menlo,Consolas,monospace; }
  :root[data-theme="light"] { --bg:#f3f5f9; --card:#fff; --card2:#f8fafc; --fg:#162033; --mute:#5b6779; --line:#d8dee8; --sel:#eef2f8;
          --run:#0b84c6; --ok:#13865a; --bad:#d23b3b; --warn:#b26b00; --accent:#c27c00; --floor:#eef2f8; --floor2:#e6ebf3;
          --glow:0 0 0 1px rgba(194,124,0,.35), 0 6px 18px rgba(20,32,51,.08); }
  * { box-sizing:border-box }
  body { margin:0; color:var(--fg); font:13px/1.5 var(--mono); background:radial-gradient(1200px 600px at 70% -200px, rgba(76,201,240,.07), transparent 60%), var(--bg) }
  :root[data-theme="light"] body { background:var(--bg) }
  .app { min-height:100vh }
  aside { border-right:1px solid var(--line); background:linear-gradient(180deg, var(--card), var(--bg)); padding:12px 0; max-height:100vh; position:sticky; top:0; overflow:auto; display:flex; flex-direction:column }
  .side-top { display:flex; align-items:center; gap:4px; padding:0 8px 8px 14px } .side-top .side-h { padding:0; flex:1 }
  button.icon { padding:0 6px; border-color:transparent; background:none; color:var(--mute) } button.icon:hover { color:var(--fg) } #side-gear.on { color:var(--ok) }
  #side-filter { margin:0 10px 6px; width:auto }
  .popover[hidden] { display:none } .popover { margin:0 10px 8px; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:8px; display:grid; gap:6px; font-size:12px }
  #side-grip { position:absolute; top:0; right:-3px; width:6px; height:100%; cursor:col-resize; z-index:2 } #side-grip:focus { outline:2px solid var(--accent) }
  aside { position:sticky } .app.rail aside .side-h, .app.rail #side-filter, .app.rail #side-gear, .app.rail #merge-box, .app.rail .credit, .app.rail #side-pop, .app.rail #side-grip { display:none }
  .app.rail .task .id, .app.rail .task .ttl, .app.rail .task .part, .app.rail .task .badge, .app.rail .task .sub, .app.rail .wt, .app.rail .done-h { display:none }
  .app.rail .task { padding:6px 0; text-align:center } .app.rail .side-top { padding:0 0 8px; justify-content:center }
  .sdot { display:inline-block; width:9px; height:9px; border-radius:50%; border:2px solid var(--mute); flex:none }
  .sdot.amber { background:var(--warn); border-color:var(--warn) } .sdot.run { background:var(--run); border-color:var(--run) } .sdot.bad { background:var(--bad); border-color:var(--bad) } .sdot.faint { opacity:.35 }
  .task .ttl { color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0 } .task .part { font-size:10px; color:var(--mute); white-space:nowrap }
  .done-h { padding:8px 14px 2px; font-size:12px; color:var(--mute); cursor:pointer }
  #tasks { flex:1 }
  main { padding:4px 20px 24px; min-width:0 }
  @media (max-width: 860px) { .app { grid-template-columns:1fr } aside { position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line) } }
  button { font:inherit; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:3px; padding:3px 12px; cursor:pointer }
  button:hover { border-color:var(--accent) } button:disabled { opacity:.5; cursor:default }
  button.primary { border-color:var(--accent); color:var(--accent) } button.danger { border-color:var(--bad); color:var(--bad) }
  input[type=text], textarea { font:inherit; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:3px; padding:4px 8px; width:100% }
  a { color:var(--run) }
  h1 { font-size:17px; margin:14px 0 2px; color:var(--accent) }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--mute); margin:24px 0 10px }
  h2::before { content:""; display:inline-block; width:6px; height:6px; margin-right:8px; background:var(--accent); vertical-align:middle; border-radius:1px }
  .meta { color:var(--mute); font-size:12px } .warn { color:var(--warn) } .bad { color:var(--bad) } .ok { color:var(--ok) }
  details > summary { cursor:pointer; color:var(--mute); font-size:12px }
  /* brand */
  .brand { display:flex; align-items:center; gap:12px; padding-bottom:12px; border-bottom:1px solid var(--line) }
  .brand .logo { width:40px; height:40px; flex:none } .brand .logo .pulse { stroke-dasharray:60; animation:pulse 2.4s linear infinite }
  .bname { display:flex; flex-direction:column; line-height:1.15 } .bname b { color:var(--accent); letter-spacing:.18em; font-size:16px }
  .bname span { color:var(--mute); font-size:11px; letter-spacing:.08em; text-transform:uppercase }
  .controls { margin-left:auto; display:flex; gap:8px; align-items:center; font-size:12px; color:var(--mute); position:relative }
  .popover.menu { position:absolute; right:0; top:100%; margin:6px 0 0; z-index:5; min-width:240px; box-shadow:0 8px 24px rgba(0,0,0,.35) }
  #menu-btn { font-size:16px }
  .live { display:inline-flex; align-items:center; gap:6px } .live i { width:8px; height:8px; border-radius:50%; background:var(--ok) } .live.off i { background:var(--warn) }
  @keyframes pulse { 0% { stroke-dashoffset:60 } 60%,100% { stroke-dashoffset:0 } }
  /* sidebar */
  .side-h { padding:0 14px 8px; font-weight:600; color:var(--accent); text-transform:uppercase; letter-spacing:.14em; font-size:11px }
  .wt { padding:10px 14px 4px; color:var(--mute); font-size:12px; overflow-wrap:anywhere } .wt b { color:var(--fg) }
  .task { display:block; width:100%; text-align:left; border:0; border-left:3px solid transparent; border-radius:0; background:none; padding:6px 14px 6px 18px }
  .task:hover, .task.sel { background:var(--sel) } .task.sel { border-left-color:var(--accent) }
  .task .t { display:flex; gap:6px; align-items:center; min-width:0 } .task .id { font-weight:600; white-space:nowrap }
  .task .sub { color:var(--mute); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .credit { display:block; padding:14px 0 0; color:var(--mute); font-size:11px; text-decoration:none } .credit:hover { color:var(--accent) }
  .badge { display:inline-block; min-width:18px; text-align:center; font-size:11px; font-weight:700; color:#111; background:var(--warn); border-radius:9px; padding:0 6px; margin-left:6px }
  /* badges */
  .st { font-size:11px; border:1px solid var(--line); border-radius:3px; padding:0 7px; margin-left:auto; white-space:nowrap }
  .st.running, .st.fixing { color:var(--run); border-color:var(--run) } .st.done, .st.ready-for-mr, .st.ready-to-close { color:var(--ok); border-color:var(--ok) }
  .st.FAIL, .st.blocked { color:var(--bad); border-color:var(--bad) } .st.findings, .st.clarify, .st.mr-unchecked { color:var(--warn); border-color:var(--warn) }
  /* needs you: one calm list grouped by what the dev must do; amber only for Answer and Approve */
  .waiting { margin-top:14px; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:4px 12px 12px }
  .waiting h2 { color:var(--fg) } .ncount { color:var(--mute); text-transform:none; letter-spacing:0 }
  .ngroup { margin-top:8px } .ngroup-h { font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--mute); margin:6px 0 4px; cursor:default }
  details.ngroup > summary.ngroup-h { cursor:pointer } .ngroup-h .n { color:var(--fg) }
  .nlist { display:grid; grid-template-columns:minmax(0,1fr); gap:6px }
  .nrow { background:var(--card2); border:1px solid var(--line); border-left:3px solid var(--line); border-radius:4px; padding:6px 10px; overflow-wrap:anywhere }
  .ngroup[data-group="answer"] .nrow, .ngroup[data-group="approve"] .nrow { border-left-color:var(--warn) }
  .ngroup[data-group="idle"] .nrow, .ngroup[data-group="progress"] .nrow { opacity:.8 }
  .nrow.mine { box-shadow:inset 0 0 0 1px rgba(76,201,240,.45) }
  .nrow-h { display:flex; gap:8px; align-items:center } .nmain { flex:1; min-width:0 } .nwho { font-size:12px; color:var(--mute) } .nwho b { color:var(--fg) }
  .nsay { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .nside { display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end }
  .nbadge { font-size:10px; border:1px solid var(--line); border-radius:3px; padding:0 5px; color:var(--mute) } .nbadge.held { color:var(--ok); border-color:var(--ok) }
  .nago { font-size:11px; color:var(--mute) }
  /* a capped box that holds more than it shows fades at its fold */
  .fold { -webkit-mask-image:linear-gradient(180deg, #000 calc(100% - 28px), transparent); mask-image:linear-gradient(180deg, #000 calc(100% - 28px), transparent) }
  .fold.at-end { -webkit-mask-image:none; mask-image:none }
  .ndot { width:7px; height:7px; border-radius:50%; background:var(--run); flex:none }
  .nrow-b { margin-top:6px; border-top:1px dashed var(--line); padding-top:6px }
  .cards { display:grid; gap:8px }
  .alert { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--warn); border-radius:4px; padding:10px 12px; overflow-wrap:anywhere }
  .alert.question { border-left-color:var(--run) } .alert.permission, .alert.FAIL { border-left-color:var(--bad) } .alert.done, .alert.ready-for-mr { border-left-color:var(--ok) }
  .alert .head { display:flex; align-items:center; gap:8px; flex-wrap:wrap }
  .alert .q { margin:8px 0 2px; font-weight:600 } .alert label { display:block; margin:2px 0 2px 8px; cursor:pointer } .alert .opt-d { color:var(--mute); font-size:12px }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; align-items:center }
  .action { margin-top:6px }
  .cmd { display:flex; gap:6px; align-items:flex-start; margin-top:6px }
  .cmd .k { color:var(--mute); font-size:12px; white-space:nowrap; padding-top:4px }
  .cmd code { flex:1; min-width:0; font:12px var(--mono); background:#05080f; color:#cfe8ff; border:1px solid var(--line); border-radius:3px; padding:4px 8px; overflow-wrap:anywhere; user-select:all }
  :root[data-theme="light"] .cmd code { background:#0f1726; color:#e6f1ff }
  @media (max-width: 760px) { .cmd { flex-wrap:wrap } .cmd .k { width:100% } }
  /* task state */
  .statebox { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:10px 12px; margin:10px 0; box-shadow:var(--glow) }
  .statebox .st { margin-left:0 } .next { margin:6px 0 } .next b { color:var(--fg) }
  .purpose { color:var(--mute); white-space:pre-wrap; margin:0; font:inherit }
  @keyframes bob { 50% { transform:translateY(-3px) } }
  @keyframes wave { 0%,100% { transform:rotate(-12deg) } 50% { transform:rotate(14deg) } }
  .pop { margin-top:10px; background:var(--card); border:1px solid var(--accent); border-radius:6px; padding:10px 12px; box-shadow:var(--glow) }
  .pop .head { display:flex; gap:10px; align-items:center } .pop .detail { font-size:12px; overflow-wrap:anywhere; margin-top:4px }
  /* robots */
  .bot .head { fill:var(--card2); stroke:var(--role); stroke-width:1.6 } .bot .visor { fill:#05080f } :root[data-theme="light"] .bot .visor { fill:#1d2738 }
  .bot .eyes circle { fill:var(--role) } .bot .eye-line { fill:none; stroke:var(--role); stroke-width:1.6; stroke-linecap:round } .bot .antenna { fill:var(--role) }
  .bot.idle, .bot.stale { opacity:.55 } .bot.failed .head, .bot.blocked .head { stroke:var(--bad) } .bot.failed .eye-line, .bot.blocked .eye-line { stroke:var(--bad) }
  .bot.running .antenna { animation:blink 1.1s steps(2) infinite } .bot.running .eyes { animation:scan 1.8s ease-in-out infinite }
  @keyframes blink { 50% { opacity:.15 } } @keyframes scan { 0%,100% { transform:translateX(-1.6px) } 50% { transform:translateX(1.6px) } }
  @media (prefers-reduced-motion: reduce) { .bot.running .antenna, .bot.running .eyes, .seat.running svg, .bubble.hand, .brand .logo .pulse { animation:none } .floor .token { transition:none } }
  /* findings */
  .fsum { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px }
  .fstate { font-size:11px; border:1px solid var(--line); border-radius:3px; padding:0 7px; white-space:nowrap }
  .fstate.needs-you { color:var(--warn); border-color:var(--warn) } .fstate.agent, .fstate.fixing { color:var(--run); border-color:var(--run) } .fstate.fixed, .fstate.accepted { color:var(--ok); border-color:var(--ok) }
  .fcards { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:10px }
  .fcard { background:linear-gradient(180deg, var(--card2), var(--card)); border:1px solid var(--line); border-left:3px solid var(--line); border-radius:4px; padding:10px 12px }
  .fcard.needs-you { border-left-color:var(--warn); box-shadow:var(--glow) } .fcard.agent, .fcard.fixing { border-left-color:var(--run) } .fcard.fixed, .fcard.accepted { border-left-color:var(--ok); opacity:.8 }
  .fhead { display:flex; align-items:center; gap:8px; flex-wrap:wrap } .fhead .fstate { margin-left:auto }
  .sev { font-size:11px; color:var(--mute) } .sev.critical, .sev.high { color:var(--bad) } .sev.medium { color:var(--warn) }
  .ftext { margin:6px 0; overflow-wrap:anywhere } .fdetail { white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; color:var(--mute); margin:4px 0; max-height:240px; overflow:auto } .factor { color:var(--mute); font-size:12px }
  /* files, rulings, events */
  .pipe { display:flex; flex-wrap:wrap; gap:6px; align-items:center }
  .chip { display:inline-flex; align-items:center; gap:6px; border-radius:3px; background:var(--card2) }
  .chip.ok, .chip.PASS { border-color:var(--ok); color:var(--ok) } .chip.running { border-color:var(--run); color:var(--run) }
  .chip.FAIL, .chip.failed, .chip.blocked { border-color:var(--bad); color:var(--bad) } .chip.PASS_WITH_FINDINGS { border-color:var(--warn); color:var(--warn) } .chip.pending { color:var(--mute) }
  pre.file { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:12px; white-space:pre-wrap; overflow-wrap:anywhere; max-height:60vh; overflow:auto }
  .rulings div { overflow-wrap:anywhere; font-size:12px; padding:3px 0; border-top:1px dashed var(--line) }
  table { border-collapse:collapse; width:100% } td { border-top:1px solid var(--line); padding:4px 6px; vertical-align:top; font-size:12px } td.d { overflow-wrap:anywhere }
  dialog { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; width:min(760px,96vw); max-height:90vh; overflow:auto; padding:16px }
  dialog::backdrop { background:rgba(0,0,0,.5) } dialog h3 { margin:0 0 8px; font-size:15px; color:var(--accent) }
  dialog .target { border-top:1px solid var(--line); padding:8px 0 } dialog label { display:block; margin:6px 0 2px } dialog ul { margin:2px 0 4px 22px; padding:0; font-size:12px; overflow-wrap:anywhere }

  /* "Now": the one verb for the dev */
  .where { display:flex; flex-wrap:wrap; gap:4px; align-items:center; font-size:12px; color:var(--mute); margin-top:2px }
  .crumb::after { content:"›"; margin:0 4px; color:var(--line) } .crumb.here { color:var(--accent); font-weight:600 } .crumb.here::after { content:"" }
  .now { display:grid; grid-template-columns:150px minmax(0,1fr); border-radius:6px; margin:12px 0 4px; overflow:hidden; border:1px solid var(--line) }
  .now .verb { display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; letter-spacing:.08em; line-height:1.3; text-align:center; padding:12px }
  .now.act { border-color:rgba(245,165,36,.55) } .now.act .verb { background:rgba(245,165,36,.12); color:var(--warn) }
  .now.wait .verb { background:rgba(76,201,240,.15); color:var(--run) }
  .nowbody { padding:10px 12px; display:grid; gap:8px; background:var(--card) } .nowhead .st { margin-left:0 }
  .who { display:flex; align-items:center; gap:8px } .extra { font-size:12px }
  @media (max-width: 700px) { .now { grid-template-columns:1fr } .now .verb { font-size:16px; padding:6px } }
  .tabs { display:flex; gap:6px; margin:16px 0 8px } .tabs button.on { border-color:var(--accent); color:var(--accent) }
  /* the steps as a tree */
  .tree, .tree ul { list-style:none; margin:0; padding:0 } .tree ul { margin-left:18px; border-left:1px dashed var(--line); padding-left:10px }
  .tree .row { display:flex; align-items:center; gap:8px; padding:4px 6px; border-radius:4px } .tree .row.click, .tree li > .row[data-node] { cursor:pointer }
  .tree .row:hover { background:var(--sel) } .tree .g { width:14px; text-align:center }
  .node.ok > .row .g { color:var(--ok) } .node.todo > .row { opacity:.6 } .node.cur > .row { background:var(--sel); box-shadow:inset 3px 0 0 var(--accent) }
  .node.bad > .row .g, .node.bad > .row b { color:var(--bad) } .node.warn > .row b { color:var(--warn) } .node.run > .row b { color:var(--run) }
  .you { margin-left:auto; font-size:10px; font-weight:700; letter-spacing:.1em; color:#111; background:var(--accent); border-radius:3px; padding:1px 6px }
  .count { font-size:10px; background:var(--warn); color:#111; border-radius:8px; padding:0 6px; font-weight:700 }
  .kids { margin:2px 0 6px 30px; display:grid; gap:6px } .kids.fsum { display:flex; flex-wrap:wrap } .tree pre.file { margin:4px 0 8px 30px }
  .finding { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--line); border-radius:4px; padding:6px 10px }
  .finding.needs-you { border-left-color:var(--warn) } .finding.agent, .finding.fixing { border-left-color:var(--run) } .finding.fixed, .finding.accepted { border-left-color:var(--ok); opacity:.8 }
  .finding [aria-pressed="true"] { border-color:var(--accent); color:var(--accent); font-weight:700 }
  .finding .fhead { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap } .finding .fstate { margin-left:auto }
  /* the office, a floor plan */
  .plan { overflow-x:auto } .floor { position:relative; min-width:760px; max-width:1040px; margin:0 auto; aspect-ratio:1000/600; border-radius:8px; overflow:hidden; border:1px solid var(--line) }
  .floor-svg { position:absolute; inset:0; width:100%; height:100% }
  :root { --corr1:#24211c; --corr2:#2e2a23; --wall:#55504a; --fr1:#123056; --fr2:#2a5590; --fw1:#34373c; --fw2:#3f4247; --fv1:#26332d; --fv2:#31423a; --fd1:#3d3022; --fd2:#4a3a29;
          --desk:#6b5236; --sheet:#dce9f8; --ink:#2a5590; --tool:#e8833a; --brick:#a4553a; --cone:#f07c22; --hazard:#f2b705; --hat-boss:#f4f3ee;
          --fl1:#3a2438; --fl2:#47304a; --sofa:#2f6f73; --sofa2:#3c878c; --rug:#6b3b52; --leaf:#3fa463; --pot:#b5653c }
  :root[data-theme="light"] { --corr1:#e2d6bf; --corr2:#d6c8ad; --wall:#8a8174; --fr1:#2f5f9e; --fr2:#5b86c4; --fw1:#c9cbce; --fw2:#bcbec2; --fv1:#cfe1d5; --fv2:#bad3c2; --fd1:#e8cd9b; --fd2:#d9b97f;
          --desk:#9b7447; --sheet:#ffffff; --ink:#2f5f9e; --tool:#e8833a; --brick:#b9603f; --cone:#f07c22; --hazard:#f2b705; --hat-boss:#ffffff;
          --fl1:#f0dfe6; --fl2:#e4cbd6; --sofa:#4a9ca1; --sofa2:#6bb7bb; --rug:#d99ab4; --leaf:#3fa463; --pot:#c4744a }
  /* a room's name is a site sign: yellow board, dark letters */
  .rlabel { position:absolute; font-size:11px; font-weight:700; letter-spacing:.02em; color:#1d1a14; background:var(--hazard); border:2px solid #1d1a14; border-radius:3px; padding:0 9px; box-shadow:0 2px 0 rgba(0,0,0,.35) }
  .rlabel.here { outline:2px solid var(--accent); outline-offset:2px }
  .seat { position:absolute; transform:translate(-50%,-62%); display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:0; padding:0 }

  .bubble.hand { background:var(--accent); animation:wave 1s ease-in-out infinite }
  .floor .token { position:absolute; transform:translate(-50%,-50%); background:#fff8c5; color:#3b3200; font-weight:700; font-size:11px; border-radius:3px; padding:2px 8px; box-shadow:0 4px 12px rgba(0,0,0,.35); transition:left .9s cubic-bezier(.6,.05,.3,1), top .9s cubic-bezier(.6,.05,.3,1); white-space:nowrap }

  :root { --hand-line:#3b2a00 } :root[data-theme="light"] { --hand-line:#5a3d00 }
  .hand-ico { vertical-align:-3px; filter:drop-shadow(0 0 4px rgba(245,165,36,.55)) }
  .bubble.hand { background:#fff3d6; padding:2px 3px; border-radius:50%; line-height:0; box-shadow:0 0 0 0 rgba(245,165,36,.6); animation:wave 1.1s ease-in-out infinite, ring 1.6s ease-out infinite }
  @keyframes ring { 0% { box-shadow:0 0 0 0 rgba(245,165,36,.55) } 100% { box-shadow:0 0 0 12px rgba(245,165,36,0) } }

  .switches { display:flex; flex-wrap:wrap; gap:8px; align-items:center; border-top:1px dashed var(--line); padding-top:8px; font-size:12px }
  .switch { display:inline-flex; align-items:center; gap:6px; font-size:12px } .switch i { width:26px; height:14px; border-radius:7px; background:var(--line); position:relative }
  .switch i::after { content:""; position:absolute; top:2px; left:2px; width:10px; height:10px; border-radius:50%; background:var(--mute); transition:left .2s }
  .switch.on i { background:rgba(61,220,151,.35) } .switch.on i::after { left:14px; background:var(--ok) } .switch.on b { color:var(--ok) }

  /* the site, Gather style: the map, the crew beside it, the session's chat under it */
  .site { display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:12px; align-items:start }
  @media (max-width: 1180px) { .site { grid-template-columns:1fr } }
  .stage { min-width:0; overflow-x:auto } .stage .floor { margin:0 }
  .sitebar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 8px; font-size:12px } .sitebar button { white-space:nowrap }
  .crew { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; position:sticky; top:10px; max-height:calc(100vh - 20px); overflow:auto }
  .crew h3 { margin:4px 4px 6px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent) }
  .crew .pop { margin:0 0 10px }
  .crew-row { display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:1px solid transparent; border-radius:6px; padding:4px 6px; color:var(--fg); font:inherit; cursor:pointer }
  .crew-row:hover { background:var(--sel) } .crew-row.open { border-color:var(--accent); background:var(--sel) }
  .crew-row .cn { display:grid; min-width:0; flex:1; line-height:1.35 } .crew-row .meta { font-size:11px }
  .crew-row .cl { font-size:11px; color:var(--run); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .crew-row.away { opacity:.7 } .crew-row.hand { border-color:var(--warn); box-shadow:var(--glow) }
  .seat { cursor:pointer; z-index:1 } .seat.open, .seat.walking { z-index:3 } .seat .face { display:contents }
  .bubble.errand { background:#fff8c5; color:#3b3200 } .bubble.zz { background:var(--card2); color:var(--mute); border:1px solid var(--line); box-shadow:none; font-weight:500 }
  #body.notask > :not(#plan) { display:none } .seat:has(.errand) .face .bubble.say { display:none }
  .sitebar .btns { display:flex; gap:6px } .sitebar .demo-on { color:var(--warn) }
  .seat.walking svg { animation:walk .36s ease-in-out infinite } .seat.away .tag { opacity:.8 }
  @keyframes walk { 0%,100% { transform:translateY(0) rotate(-5deg) } 50% { transform:translateY(-4px) rotate(5deg) } }
  .bubble.say { top:auto; bottom:calc(100% + 2px); right:auto; left:50%; transform:translateX(-50%); max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; font-size:10.5px; padding:2px 8px; border-radius:8px 8px 8px 2px; z-index:2 }
  .rglow { position:absolute; pointer-events:none; border-radius:2px }
  .rglow.on { box-shadow:inset 0 0 0 3px rgba(76,201,240,.55), inset 0 0 46px rgba(76,201,240,.16); animation:glow 2.4s ease-in-out infinite }
  @keyframes glow { 50% { box-shadow:inset 0 0 0 3px rgba(76,201,240,.25), inset 0 0 30px rgba(76,201,240,.08) } }
  .rlabel.lounge { background:#f6c6dc }
  #chatbar .alert { margin:10px 0 0 } #chatbar .alert .head { display:flex; align-items:center; gap:8px }
  .chat.off { margin-top:10px; border:1px dashed var(--line); border-radius:6px; padding:8px 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap }
  .plan:fullscreen { background:var(--bg); padding:16px; overflow:auto } .plan:fullscreen .site { grid-template-columns:minmax(0,1fr) 310px }
  .plan:fullscreen .floor { max-width:min(100%, calc((100vh - 150px) * var(--ar, 1.4))) }
  @media (prefers-reduced-motion: reduce) { .floor .token { transition:none } .seat.walking svg, .rglow.on { animation:none } }

  /* the world: a canvas of tiles, HTML over it for names, bubbles and signs */
  .worldbox { position:relative; height:clamp(420px, calc(100vh - 300px), 900px); border-radius:12px; overflow:hidden; border:1px solid var(--line); background:#6fa64f; box-shadow:0 10px 30px rgba(0,0,0,.25) }
  #world { position:absolute; inset:0; width:100%; height:100%; display:block; outline:none; cursor:pointer; image-rendering:pixelated }
  #world:focus-visible { box-shadow:inset 0 0 0 3px var(--accent) }
  #world-ov { position:absolute; inset:0; pointer-events:none; overflow:hidden; font-family:var(--mono); z-index:1 }
  #world-ov .who { position:absolute; left:0; top:0; pointer-events:auto; background:none; border:0; padding:0; width:0; height:0; cursor:pointer }
  #world-ov .face { position:absolute; left:0; bottom:0; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:3px }
  #world-ov .bubble { position:static; transform:none; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; animation:none }
  #world-ov .bubble.hand { animation:wave 1.1s ease-in-out infinite, ring 1.6s ease-out infinite }
  #world-ov .who > .errand { position:absolute; left:0; bottom:44px; transform:translateX(-50%) }
  #world-ov .tag { font-size:10.5px; padding:1px 8px; background:rgba(16,20,30,.82) }
  #world-ov .who.open .tag { outline:2px solid var(--accent) } #world-ov .who.near .tag { background:var(--accent); color:#111 }
  #world-ov .who.near .tag .dot { background:#111 }
  #world-ov .tag.me { background:#e76f51; color:#fff; font-weight:700 }
  #world-ov .rlabel, #world-ov .rglow, #world-ov .token { position:absolute; left:0; top:0 }
  #world-ov .rglow { border-radius:4px } #world-ov .token { transition:none }
  #minimap { position:absolute; z-index:2; right:10px; top:10px; border:2px solid rgba(255,255,255,.85); border-radius:8px; background:#000; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.35) }
  .gbar { position:absolute; z-index:2; left:50%; bottom:12px; transform:translateX(-50%); display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:nowrap; white-space:nowrap; background:rgba(18,22,34,.94); color:#fff; border-radius:14px; padding:6px 10px; box-shadow:0 8px 24px rgba(0,0,0,.4); max-width:calc(100% - 24px) }
  .gbar button { background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.18); border-radius:10px; padding:4px 10px }
  .gbar button:hover { background:rgba(255,255,255,.16) } .gbtns { display:flex; gap:6px; flex-wrap:nowrap }
  .me-chip { display:flex; align-items:center; gap:8px } .me-chip .meta { color:#c9d1dd; font-size:11px; max-width:210px; overflow:hidden; text-overflow:ellipsis }
  .avatar { image-rendering:pixelated; vertical-align:middle; flex:none }
  .world-hint { margin:8px 2px 0; font-size:12px }
  #chatbar.near .alert, #chatbar.near .chat { box-shadow:0 0 0 2px var(--accent) }
  .plan:fullscreen .worldbox { height:calc(100vh - 110px) }
  @media (max-width: 700px) { #minimap { width:110px; height:auto } .gbar { gap:6px } .me-chip .meta { display:none } }

  /* the page: a top bar, the world in the middle, the task or the crew beside it */
  .topbar { position:sticky; top:0; z-index:30; background:var(--bg); padding:10px 20px; margin:0 }
  .topbar .controls { flex-wrap:nowrap; white-space:nowrap } .topbar .bname span { white-space:nowrap }
  @media (max-width: 1640px) { #notify-state, .topbar .bname span { display:none } }
  .taskmenu { position:relative; margin-left:8px } .taskmenu > summary { list-style:none; display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:8px; padding:5px 12px; color:var(--fg); font-size:12px; max-width:420px; background:var(--card) }
  .taskmenu > summary::-webkit-details-marker { display:none } .taskmenu > summary::after { content:"▾"; color:var(--mute) } .taskmenu > summary:hover { border-color:var(--accent) }
  .taskmenu .pick { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .taskmenu .menu { position:absolute; top:calc(100% + 6px); left:0; width:360px; max-height:65vh; overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 14px 34px rgba(0,0,0,.4); padding:10px 0; z-index:40 }
  .projmenu > summary { font-weight:700 } .projmenu .live-dot { width:8px; height:8px; border-radius:50%; background:var(--line); display:inline-block; flex:none } .projmenu .live-dot.on { background:var(--ok) }
  .projmenu + .taskmenu { margin-left:6px }
  .desk { display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:14px; align-items:start; margin-top:10px }
  .side .waiting { margin:0 0 10px } .side .credit { padding-top:16px }
  /* The office fills the window: no page scroll, the map takes every pixel left, the chat sits
     under it and the side panel scrolls on its own. A narrow window scrolls as before. */
  @media (min-width: 1101px) {
    html, body { height:100% } html { background:var(--bg) } body { overflow:hidden }
    .app { height:100vh; display:flex; flex-direction:column }
    main { flex:1; min-height:0; padding:10px 16px 12px; display:flex; flex-direction:column }
    .desk { flex:1; min-height:0; margin-top:0; align-items:stretch; grid-template-rows:minmax(0,1fr) }
    .center, #plan, .stage { display:flex; flex-direction:column; min-height:0 } .center { height:100% } #plan, .stage { flex:1 }
    .worldbox { flex:1; height:auto; min-height:0 }
    .world-hint { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:6px 2px 0 }
    .dock { margin-top:8px; padding:8px 12px } .dock .said { max-height:34vh; resize:vertical } .dock-row { margin-top:6px } .dock-row textarea { min-height:40px }
    .side { position:static; height:100%; max-height:none }
  }
  @media (max-width: 1100px) { .desk { grid-template-columns:1fr } }
  .side { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px 14px; position:sticky; top:70px; max-height:calc(100vh - 82px); overflow:auto }
  .side .tabs { margin:0 0 6px } .side h1 { font-size:15px; margin:8px 0 2px } .side .now { grid-template-columns:1fr } .side .now .verb { font-size:14px; padding:6px }
  .crew-h { margin:10px 4px 6px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent) }
  .dock { margin-top:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; transition:box-shadow .3s }
  .dock.turn { border-color:var(--accent); box-shadow:var(--glow) } #chatbar.near { box-shadow:0 0 0 2px var(--accent) }
  .dock-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap } .dock-head .meta { margin-left:auto }
  .dock .said { margin:6px 0 0; padding:6px 10px; background:var(--card2); border-radius:8px; white-space:pre-wrap; max-height:140px; overflow:auto; font-size:12px }
  .dock-row { display:flex; gap:8px; align-items:flex-end; margin-top:8px } .dock-row textarea { flex:1; resize:vertical; min-height:46px; border-radius:8px }
  .dock-row button { white-space:nowrap; padding:6px 14px; border-radius:8px }
  .turn-msg { white-space:pre-wrap; overflow-wrap:anywhere; max-height:260px; overflow:auto; margin-top:6px; padding:6px 8px; background:var(--bg); border:1px solid var(--line); border-radius:3px; font-size:12px }
  .dismiss { float:right; border:0; background:none; color:var(--mute); font-size:16px; line-height:1; padding:0 4px } .dismiss:hover { color:var(--fg) }
  .dismissed { margin-top:8px } .dismissed > summary { font-size:12px } .dismissed .alert { opacity:.7; margin-top:6px }
</style>

<div class="app">
<header class="brand topbar"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="23" width="44" height="34" rx="10" fill="#121826" stroke="#f5a524" stroke-width="3"/><path d="M7 27h50a2.5 2.5 0 0 0 0-5h-3.5C53.5 11.5 44 4 32 4S10.5 11.5 10.5 22H7a2.5 2.5 0 0 0 0 5z" fill="#f5a524"/><rect x="28.5" y="4.5" width="7" height="16" rx="2.5" fill="#c97f00"/><rect x="16" y="32" width="32" height="15" rx="5" fill="#070b14"/><path class="pulse" d="M19 40h6l3-5.5 4.5 11 3-5.5h9.5" fill="none" stroke="#4cc9f0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="50" width="16" height="3" rx="1.5" fill="#f5a524" opacity=".55"/></svg><div class="bname"><b>FOREMAN</b><span data-i18n="brand.tag">mission control for coding agents</span></div>
<details class="taskmenu projmenu" id="projmenu" hidden><summary id="proj-pick"></summary><div class="menu"><div class="side-h" data-i18n="proj.title">Projects</div><div id="projects"></div></div></details><details class="taskmenu" id="taskmenu"><summary id="task-pick"></summary><div class="menu"><div class="side-h" data-i18n="side.tasks">Tasks</div><div id="tasks"><div class="meta" style="padding:0 14px" data-i18n="loading">Loading…</div></div></div></details>
<div class="controls">
  <span class="live" id="live"></span>
  <button id="menu-btn" type="button" class="icon" aria-expanded="false" aria-controls="menu"></button>
  <div id="menu" class="popover menu" hidden>
    <button id="lang-btn" type="button"></button>
    <button id="theme-btn" type="button"></button>
    <button id="mute-btn" type="button"></button>
    <button id="notify-btn" type="button"></button>
    <span id="notify-state" class="meta"></span>
  </div>
</div></header>
<main>
<div class="desk">
<div class="center"><div id="plan" class="plan"></div></div>
<section class="side">
<section class="waiting" id="waiting" hidden>
<div id="needs">
<h2 id="waiting-title" data-i18n="waiting.title">Waiting on you <span id="needs-count" aria-live="polite"></span></h2>
<div class="ngroup" data-group="answer"><h3 class="ngroup-h"></h3><div class="cards nlist" id="attn"></div></div>
<div class="ngroup" data-group="approve"><h3 class="ngroup-h"></h3><div class="cards nlist" id="needs-approve"></div></div>
<div class="ngroup" data-group="decide"><h3 class="ngroup-h"></h3><div class="cards nlist" id="needs-decide"></div></div>
<div class="ngroup" data-group="ship"><h3 class="ngroup-h"></h3><div class="cards nlist" id="todo" style="margin:0 0 8px"></div></div>
<div class="ngroup" data-group="idle"><h3 class="ngroup-h"></h3><div class="cards nlist" id="needs-idle"></div></div>
<details class="ngroup" data-group="progress" hidden><summary class="ngroup-h"></summary><div class="cards nlist" id="needs-progress"></div></details>
</div>
</section>
<div class="meta" id="legend" style="margin-top:8px"></div>
<div class="tabs"><button type="button" data-tab="tree" data-i18n="tab.tree">Steps</button><button type="button" data-tab="office" data-i18n="tab.office">Office</button></div>
<div id="pane-task">
<h1 id="title">Foreman</h1>
<div class="where" id="where"></div>
<div id="now"></div>
<div id="body" hidden>
<div id="tree"></div>
<h2 data-i18n="h.rulings">Decisions taken without you</h2><div class="rulings" id="rulings"></div>
<details id="events"><summary id="events-sum"></summary><table id="feed"></table></details>
</div>
</div>
<div id="pane-crew" hidden><div id="pop"></div><h3 class="crew-h" data-i18n="h.crew">Crew</h3><div id="crew-list"></div></div>
<a class="credit" href="https://github.com/yantadeu/foreman" target="_blank" rel="noopener" data-i18n="brand.credit">Foreman by Yan Tadeu · Apache-2.0</a>
</section>
</div>
</main>
</div>

  before.forEach(s => list.push({ key: STAGE_STEP[s.agent] || "contract", label: STAGE_STEP[s.agent] ? t("tl." + STAGE_STEP[s.agent]) : esc(roleName(s.agent)), ok: s.written, role: s.agent, stage: s }));
  const reviewed = lenses.length > 0 && verdicts === lenses.length;
  list.push({ key: "reviews", label: t("tl.reviews", { n: verdicts, total: lenses.length }), ok: reviewed, lenses });
  list.push({ key: "decision", label: reviewed && !anyFindings ? t("tl.decision.none") : t("tl.decision"), ok: reviewed && (!anyFindings || ["ready-for-mr", "done"].includes(d.status)), role: "main" });
  if (retro) list.push({ key: "retro", label: t("tl.retro"), ok: retro.written, role: "retrospective", stage: retro });
  list.push({ key: "closed", label: t("tl.closed"), ok: d.status === "done" });
  const now = d.status === "done" ? list.length - 1 : Math.max(0, list.findIndex(s => !s.ok));
  return { list, now };
}

// The agent a hand belongs to: an alert of this task's worktree for that agent id, or a stage
// that stopped and asks for context.
function handOf(d, lane) {
  const g = attention.find(x => x.name === d.worktree);
  const alert = g && g.alerts.find(a => a.agent === lane.agent || (lane.type === "main" && a.agent === "main"));
  if (alert) return { kind: "alert", alert: { ...alert, wt: g.wt, wtName: g.name, answers: g.answers, turns: g.turns, path: g.path } };
  if (lane.state === "blocked") return { kind: "blocked" };
  return null;
}
const lanesOf = (d) => { const out = {}; d.agents.forEach(l => { const k = l.type || "main"; if (!out[k] || l.seen > out[k].seen) out[k] = l }); return out };
const DEV_STEPS = ["fix-fail", "open-mr", "fix-mr-check", "mark-done", "clean-up", "clarify", "unblock"];

// "Now": one line for the dev, NEEDS YOU or WAIT, and right under it the thing to do or who works.
// Every alert and finding has one place: the needs-you list (this worktree's rows are marked) and
// the steps view; Now says how many wait and leads there.
function showNow(d, list, now) {
  const mine = needItems.filter(i => i.wt === sel.wt && NEED_GROUPS.includes(i.group));
  const open = (d.findings || []).filter(x => x.view === "needs-you" && x.state === "open");
  const items = [];
  if (mine.length) items.push(`<div class="action">${t("needs.mine", { n: mine.length })}</div>`);
  if (open.length) items.push(`<div class="alert findings"><div class="head"><b>${t("now.findings", { n: open.length })}</b></div><div class="actions"><button type="button" class="primary" data-decide="${sel.wt}" data-id="${esc(d.id)}">${t("needs.findings.go")}</button></div></div>`);
  const s = shown(d);
  if (DEV_STEPS.includes(d.next_step) && !(d.next_step === "fix-fail" && !open.length && (d.findings || []).some(x => x.view === "agent"))) {
    const buttons = [];
    if (d.closable && d.status !== "done" && ["open-mr", "mark-done", "fix-mr-check"].includes(d.next_step)) buttons.push(`<button id="close-one">${t("close.button")}</button>`);
    if (d.status === "done") buttons.push(`<button id="clean-one" class="danger">${t("clean.button")}</button>`);
    const ask = { "fix-fail": "prompt.fail", unblock: "prompt.unblock" }[d.next_step];
    const command = d.command || (ask ? sessionCmd(d.path || ".", ask, d.id) : null);
    items.push(`<div class="alert ${esc(s)}"><div class="action">${has("next." + d.next_step) ? t("next." + d.next_step, { id: d.id, wt: d.worktree, error: (d.mr && d.mr.error) || "" }) : esc(d.next_step)}</div>${ask ? `<div class="meta">${t("session.none")}</div>` : ""}${cmdBlock(command)}${buttons.length ? `<div class="actions">${buttons.join("")}</div>` : ""}</div>`);
  }
  const act = items.length > 0;
  let body;
  if (act) body = items.join("");
  else {
    const working = Object.values(lanesOf(d)).filter(l => l.state === "running" && l.type !== "main");
    body = working.length
      ? working.map(l => `<div class="who">${robot(l.type, "running", 28)}<b>${esc(roleName(l.type))}</b> <span class="meta">${l.last ? esc(l.last) : t("lane.state.running")} · ${t("lane.since", { ago: ago(l.start) })}</span></div>`).join("")
      : `<div class="action">${d.next_step && has("next." + d.next_step) ? t("next." + d.next_step, { id: d.id, wt: d.worktree, error: "" }) : statusMeaning(s)}</div>`;
  }
  const mr = d.mr;
  const extra = [];
  if (mr && !mr.error && !mr.iid && mr.state === "merged") extra.push(`<span class="meta">${t("mr.link.git")}</span>`);
  else if (mr && mr.web_url && /^https?:\/\//.test(mr.web_url)) extra.push(`<a href="${esc(mr.web_url)}" target="_blank" rel="noopener">${t("mr.link", { iid: mr.iid, state: has("mr." + mr.state) ? t("mr." + mr.state) : mr.state })}</a>`);
  else if (mr && mr.error && d.status !== "done") extra.push(`<span class="warn">${has("mr." + mr.error) ? t("mr." + mr.error) : t("mr.error", { error: mr.error })}</span>`);
  if (d.warning) extra.push(`<span class="bad">${has("warning." + d.warning) ? t("warning." + d.warning) : esc(d.warning)}</span>`);
  if (d.closed_by === "work.sh") extra.push(`<span class="meta">${t("closed.work.sh")}</span>`);
  setHTML($("now"), `<div class="now ${act ? "act" : "wait"}"><div class="verb">${t(act ? "now.act" : "now.wait")}</div><div class="nowbody"><div class="nowhead">${statusBadge(s)} <span class="meta">${statusMeaning(s)}</span></div>${body}${extra.length ? `<div class="extra">${extra.join(" · ")}</div>` : ""}${switchesLine(sel.wt)}</div></div>`);
  $("now").querySelectorAll("[data-decide]").forEach(b => b.onclick = () => decideIn(+b.dataset.decide, b.dataset.id));
  wireFindings($("now"), d);
  if ($("clean-one")) $("clean-one").onclick = () => openCleanup(`wt=${sel.wt}&id=${encodeURIComponent(d.id)}`, false);
  if ($("close-one")) $("close-one").onclick = () => openClose(d, sel.wt);
}

// Findings, each with who acts on it, and fix or accept when it waits on the dev.
const LENS_ROLE = { contract: "reviewer", security: "security-reviewer", qa: "qa-reviewer", product: "product-reviewer" };
const FSTATES = ["needs-you", "agent", "fixing", "fixed", "accepted"];
function who(x) {
  return x.view === "agent" ? t("fstate.agent.m", { agent: roleName(x.actor) })
    : x.view === "fixing" ? t("fstate.fixing.m", { agent: roleName(x.actor) })

// Fix and Accept stage a choice in the page, nothing posted; one "Send N decisions" posts each,
// says per finding what landed or why it was refused, and keeps every choice that did not land.
// A finding decided elsewhere meanwhile (a session, another tab) drops its choice.
const staged = new Map();
let decideReport = null;
const stageKey = (d, x) => d.worktree + "/" + d.id + "/" + x.key;
const stagedOf = (d) => (d.findings || []).filter(x => x.view === "needs-you" && x.state === "open" && staged.has(stageKey(d, x))).map(x => ({ x, decision: staged.get(stageKey(d, x)) }));
function findingRow(x) {
  const d = lastTask || {};
  const sev = `<span class="sev ${esc(x.severity)}">${has("sev." + x.severity) ? t("sev." + x.severity) : esc(x.severity)}</span>`;
  const choose = x.view === "needs-you" && x.state === "open"
    ? `<div class="actions">${["fix", "accepted"].map(c => `<button type="button" data-stage="${c}" data-key="${esc(x.key)}" aria-pressed="${staged.get(stageKey(d, x)) === c}">${c === "fix" ? t("fpick.fix", { agent: roleName(x.route || "executor") }) : t("fpick.accept")}</button>`).join("")}</div>` : "";
  return `<div class="finding ${esc(x.view)}" data-finding="${esc(x.key)}"><div class="fhead">${sev}<span class="ftext">${esc(lensName(x.lens))}: ${esc(x.full_text || x.summary)}</span><span class="fstate ${esc(x.view)}">${t("fstate." + x.view)}</span></div>${x.details ? `<div class="fdetail">${esc(x.details)}</div>` : ""}<div class="factor">${who(x)}</div>${choose}</div>`;
}
function decisionsBar(d) {
  const picks = stagedOf(d), report = decideReport && decideReport.task === d.worktree + "/" + d.id ? decideReport.html : "";
  return (picks.length ? `<div class="actions"><button type="button" class="primary" data-send-decisions>${t("decide.send", { n: picks.length })}</button></div>` : "") + report;
}
function wireFindings(box, d) {
  box.querySelectorAll("[data-stage]").forEach(b => b.onclick = () => {
    const x = (d.findings || []).find(f => f.key === b.dataset.key);
    if (!x) return;
    const k = stageKey(d, x);
    staged.get(k) === b.dataset.stage ? staged.delete(k) : staged.set(k, b.dataset.stage);
    showTask();
  });
  box.querySelectorAll("[data-send-decisions]").forEach(b => b.onclick = () => sendDecisions(d, sel.wt, b));
}
async function sendDecisions(d, wt, btn) {
  const picks = stagedOf(d);
  if (!picks.length || btn.disabled) return;
  btn.disabled = true;
  const task = d.worktree + "/" + d.id, lines = [];
  let ok = 0;
  for (const { x, decision } of picks) {
    try {
      const r = await post("api/findings-decision", { wt, id: d.id, key: x.key, decision });
      if (r.ok) {
        ok++;
        staged.delete(stageKey(d, x));
        lines.push(`<div class="ok">✓ ${t("decide.ok", { decision: t(decision === "fix" ? "finding.fix" : "finding.accept"), summary: x.summary })}</div>`);
      } else lines.push(`<div class="bad">✗ ${t("decide.refused", { summary: x.summary })}</div>${await errorText(r)}`);
    } catch (e) {
      lines.push(`<div class="bad">✗ ${t("decide.refused", { summary: x.summary })} ${esc(String(e))}</div>`);
    }
  }
  decideReport = { task, html: lines.join("") + `<div class="meta">${t("decide.done", { ok, n: picks.length })}</div>` + (ok ? await tellDecided(d, wt, ok) : "") };
  tick();
}
// Every finding decided: the session holding the findings question or the announcement turn for
// the page is told so (for a question, a free-text answer; for a turn, the server's
// findings-decided message). Only that ask is posted to; with none held, the message to send.
async function tellDecided(d, wt, ok) {
  const open = (d.findings || []).filter(x => x.view === "needs-you" && x.state === "open").length - ok;
  if (open > 0) return "";
  const held = attention.filter(g => g.wt === wt).flatMap(g => g.alerts).filter(a => findingsAsk(a, d.id));
  for (const a of held) {
    if (a.kind === "turn") await post("api/answer", { wt, session: a.session, agent: a.agent, qid: a.qid, kind: "findings-decided", id: d.id });
    else await post("api/answer", { wt, session: a.session, agent: a.agent, qid: a.qid,
      answers: (a.questions || []).map(() => ({ options: [], other: `findings decided on the dashboard for ${d.id}: read findings-decision.md and go on` })) });
  }
  return held.length ? `<div class="ok" data-told>${t("decide.told")}</div>`
    : `<div class="meta" data-tell>${t("decide.tell")}</div>${cmdBlock(sessionCmd(d.path || ".", "prompt.apply-findings", d.id))}`;
}

// The task as a tree: each step a node, the reviews with their findings as children, a step's
// file under it when the dev opens it. The node the task is at says "you are here".
// The world is always on screen ("office"); the side panel shows the task ("tree") or the crew.
let tab = "office", pane = "tree";
try { pane = localStorage.getItem("agent-flow-tab") === "office" ? "office" : "tree" } catch (e) {}
function setTab(name) {
  pane = name;
  try { localStorage.setItem("agent-flow-tab", pane) } catch (e) {}
  $("pane-task").hidden = pane !== "tree"; $("pane-crew").hidden = pane !== "office";
  document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === pane));
}
setTab(pane);
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => setTab(b.dataset.tab));
const openNodes = new Set();
function showTree(d, list, now) {
  const lanes = lanesOf(d);
  const lensOf = (s) => (/^04-review-(.+)\.md$/.exec(s.file || "") || [])[1] || s.agent;
  const mark = (i, s) => i === now ? (d.status === "FAIL" || d.status === "blocked" ? "bad cur" : "cur") : s.ok ? "ok" : "todo";
  const glyph = (cls) => cls.startsWith("bad") ? "✖" : cls === "cur" ? "▶" : cls === "ok" ? "✓" : "○";
  const fileOf = (s) => s && openNodes.has(s.file) ? `<pre class="file">${esc(d.files[s.file] || t("file.missing", { file: s.file }))}</pre>` : "";
  const nodes = list.map((st, i) => {
    const cls = mark(i, st);
    const here = i === now ? `<span class="you">${t("tree.here")}</span>` : "";
    let kids = "";
    if (st.key === "purpose" && openNodes.has("purpose")) kids = `<pre class="file">${esc(purposeText(d))}</pre>`;
    if (st.stage) kids = fileOf(st.stage);
    if (st.key === "reviews") kids = `<ul>${st.lenses.map(s => {
      const lane = lanes[s.agent], v = s.verdict;
      const vc = v === "FAIL" ? "bad" : v === "PASS_WITH_FINDINGS" ? "warn" : v ? "ok" : lane && lane.state === "running" ? "run" : "todo";
      const fs = (d.findings || []).filter(x => x.lens === lensOf(s));
      return `<li class="node ${vc}"><div class="row" data-node="${esc(s.file)}">${robot(s.agent, v === "FAIL" ? "failed" : v ? "ok" : lane ? lane.state : "idle", 22)}<b>${esc(roleName(s.agent))}</b><span class="meta">${s.na ? t("verdict.na") : v ? esc(verdictName(v)) : lane ? t("lane.state." + (lane.state || "idle")) : t("tree.waiting")}</span>${fs.length ? `<span class="count">${fs.length}</span>` : ""}</div>${fileOf(s)}${fs.length ? `<div class="kids">${fs.map(findingRow).join("")}</div>` : ""}</li>`;
    }).join("")}</ul>`;
    if (st.key === "decision") {
      const c = d.findings_counts || {};
      kids = FSTATES.some(k => c[k]) ? `<div class="kids fsum">${FSTATES.filter(k => c[k]).map(k => `<span class="fstate ${k}">${t("fcount." + k, { n: c[k] })}</span>`).join("")}</div>` : "";
      if (d.findings_sent) kids += `<div class="kids"><div class="ok">${t("fpick.sent.now", { wt: d.worktree })}</div>${cmdBlock(sessionCmd(d.path || ".", "prompt.apply-findings", d.id))}</div>`;
      const bar = decisionsBar(d);
      if (bar) kids += `<div class="kids">${bar}</div>`;
    }
    const clickable = st.stage || st.key === "purpose";
    return `<li class="node ${cls}"><div class="row${clickable ? " click" : ""}"${clickable ? ` data-node="${esc(st.stage ? st.stage.file : "purpose")}"` : ""}><span class="g">${glyph(cls)}</span>${st.role ? robot(st.role, st.ok ? "ok" : i === now ? "running" : "idle", 22) : ""}<b>${st.label}</b>${st.role && st.role !== "foreman" && st.role !== "main" ? `<span class="meta">${esc(roleName(st.role))}</span>` : ""}${here}</div>${kids}</li>`;
  }).join("");
  setHTML($("tree"), `<ul class="tree">${nodes}</ul>`);
  $("tree").querySelectorAll("[data-node]").forEach(r => r.onclick = (ev) => {
    if (ev.target.closest("button")) return;
    const k = r.dataset.node;
    openNodes.has(k) ? openNodes.delete(k) : openNodes.add(k);
    showTree(d, list, now);
  });
  wireFindings($("tree"), d);
  if (pendingScroll) {
    pendingScroll = false;
    const f = $("tree").querySelector(".finding.needs-you");
    if (f) { f.scrollIntoView({ block: "center" }); f.setAttribute("tabindex", "-1"); f.focus({ preventScroll: true }) }
  }
}

// The site as a virtual office: a world of tiles seen from above, in pixel art drawn here (no image
// files). You walk your own avatar (WASD, the arrows, or a click on the floor); the crew are workers

// Coming close to one opens its card; coming close to the foreman (the main session) lights the
// chat with it. Nothing here talks to the server: it draws what the page already knows.
const T = 32;  // a tile, in world pixels (16 art pixels of 2)
const ROOM_KIND = { refine: "carpet", workshop: "concrete", review: "tiles", decision: "wood" };
const KINDS = ["carpet", "concrete", "tiles", "wood"];
const PAL = {
  grass: "#7cb35b", grass2: "#6fa64f", flower: "#f4d35e", flower2: "#f28dab", tree: "#2f7d46", tree2: "#3f9a55", trunk: "#7a4f2c",
  hall: "#ddd6c8", hall2: "#d1c9b9", wallTop: "#3a3f4d", wallTop2: "#454b5b", wallFace: "#ece4d2", wallFace2: "#ddd2bb", base: "#8c7a62",
  carpet: "#4a74b8", carpet2: "#5583c6", concrete: "#aeb2b8", concrete2: "#a1a5ac", tiles: "#a3d4b4", tiles2: "#93c8a6",
  wood: "#c99665", wood2: "#bb8754", lounge: "#e6c3a6", lounge2: "#dcb596",
  desk: "#7b4f2e", deskTop: "#a8713f", deskTop2: "#b98450", monitor: "#262a35", screen: "#7fd3ff", paper: "#f7f4ea",
  leaf: "#3f9a55", leaf2: "#5cbc70", pot: "#c0703f", sofa: "#3f8f94", sofa2: "#5aaeb4", rug: "#c9708e", rug2: "#d98aa4",
  shelf: "#7a4f2c", books: ["#e76f51", "#2a9d8f", "#e9c46a", "#457b9d", "#9b5de5"], board: "#f5f5f0", ink: "#3557a0",
  cone: "#f07c22", stripe: "#f2b705", dark: "#1d1a14", brick: "#b5583c", metal: "#7d848f", metal2: "#9aa1ab", water: "#8fd3ff",
  skins: ["#f1c7a5", "#e0b08a", "#c68e62", "#9a6a45", "#6f4a30"], pants: "#3b4252", shoe: "#2a2a2a", hair: ["#3b2a20", "#1e1e1e", "#7a4b2a", "#c58b4c"],
};
const hashOf = (s) => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const roleColor = (r) => r === "main" ? "#f4f3ee" : (ROLES[r] || [/^#[0-9a-fA-F]{3,8}$/.test(agentCfg(r).color || "") ? agentCfg(r).color : "#8b98ad"])[0];

// ---- the map: rooms of flow.json in rows of two, halls around them, the break room under them
function buildWorld() {
  const rs = rooms(), W = 46, M = 2, RH = 10, GAP = 3, LH = 9;
  const bx = M, iw = W - 2 * M, x0 = bx + 3, xEnd = bx + iw - 4;
  const rows = Math.ceil(rs.length / 2), bottom = M + 3 + rows * (RH + GAP) + LH + 1;
  const H = bottom + 1 + M + 1;
  const type = Array.from({ length: H }, () => Array(W).fill("grass"));
  const kind = Array.from({ length: H }, () => Array(W).fill(""));
  const solid = Array.from({ length: H }, () => Array(W).fill(false));
  const deco = [];  // {x, y, w, h, what, solid}
  const wr = { W, H, rooms: [], seats: {}, rest: {}, type, kind, solid, deco };
  const box = (x, y, w, h, top2) => {  // walls around, floor inside
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) {
      const edge = i === x || i === x + w - 1 || j === y || j === y + h - 1 || (top2 && j === y + 1);
      type[j][i] = edge ? (top2 && j === y + 1 && i !== x && i !== x + w - 1 ? "face" : "wall") : "floor";
    }
  };
  // The building: its outer wall, a hall inside, a door to the garden at the bottom.
  box(bx, M, iw, bottom - M + 1, true);
  for (let j = M + 2; j < bottom; j++) for (let i = bx + 1; i < bx + iw - 1; i++) { type[j][i] = "hall"; }
  const gate = bx + Math.floor(iw / 2) - 1;
  type[bottom][gate] = type[bottom][gate + 1] = "hall";
  let y = M + 3;
  for (let i = 0; i < rs.length; i += 2) {
    const row = rs.slice(i, i + 2), weight = row.map(r => Math.max(2, r.agents.length));
    const avail = xEnd - x0 + 1 - (row.length - 1) * 2, total = weight.reduce((a, b) => a + b, 0);
    let x = x0;
    row.forEach((r, k) => {
      const w = k === row.length - 1 ? xEnd - x + 1 : Math.round(avail * weight[k] / total);
      const R = { r, x, y, w, h: RH, kind: ROOM_KIND[r.id] || KINDS[(i + k) % KINDS.length], door: { x: x + Math.floor(w / 2) - 1, y: y + RH - 1 } };
      box(x, y, w, RH, true);
      for (let j = y + 2; j < y + RH - 1; j++) for (let ii = x + 1; ii < x + w - 1; ii++) kind[j][ii] = R.kind;
      type[R.door.y][R.door.x] = type[R.door.y][R.door.x + 1] = "floor";
      kind[R.door.y][R.door.x] = kind[R.door.y][R.door.x + 1] = R.kind;
      wr.rooms.push(R);
      x += w + 2;
    });
    y += RH + GAP;
  }
  const L = { r: { id: "lounge" }, x: x0, y, w: xEnd - x0 + 1, h: LH, kind: "lounge" };
  L.door = { x: L.x + Math.floor(L.w / 2) - 1, y };
  box(L.x, y, L.w, LH, true);
  for (let j = y + 2; j < y + LH - 1; j++) for (let i = L.x + 1; i < L.x + L.w - 1; i++) kind[j][i] = "lounge";
  for (let d = 0; d < 3; d++) for (let j = y; j < y + 2; j++) { type[j][L.door.x + d] = "floor"; kind[j][L.door.x + d] = "lounge" }
  wr.lounge = L;
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) solid[j][i] = type[j][i] === "wall" || type[j][i] === "face" || i === 0 || j === 0 || i === W - 1 || j === H - 1;
  const put = (x, yy, w, h, what, block = true) => { deco.push({ x, y: yy, w, h, what }); if (block) for (let j = yy; j < yy + h; j++) for (let i = x; i < x + w; i++) solid[j][i] = true };
  // Furniture: a desk in front of each seat, the foreman's plan table, the room's own things.

  $("chat-extra").dataset.cmd = "1";
  setHTML($("chat-extra"), `<div class="meta">${t("chat.none")}</div>${cmdBlock(`cd ${q(c.path)} && claude ${q(text)}`)}`);
}
// The robot the dev clicked: what it does, and what it waits for, answerable right there.
function showPop(d, lanes) {
  const pop = $("pop");
  if (!pop) return;
  if (!openBot) { setHTML(pop, ""); return }
  const lane = lanes[openBot], st = d.stages.find(s => s.agent === openBot);
  const hand = lane ? handOf(d, lane) : null;
  const state = lane ? lane.state || "idle" : st && st.written ? "ok" : "idle";
  const when = lane ? (lane.end ? t("lane.took", { s: Math.round(lane.end - lane.start) }) : t("lane.since", { ago: ago(lane.start) })) : "";
  let html = `<div class="pop"><button type="button" class="dismiss" data-close-pop title="${esc(t("pop.close"))}">×</button><div class="head">${avatarImg(openBot, 48)}<div><b>${esc(openBot === "main" ? t("office.foreman") : roleName(openBot))}</b><div class="meta">${has("lane.state." + state) ? t("lane.state." + state) : esc(state)}<span data-when></span></div></div></div>`;
  if (st) html += `<div class="meta">${t("pop.file", { file: st.file })}${st.verdict ? " · " + esc(verdictName(st.verdict)) : ""}</div>`;
  if (lane && lane.last) html += `<details><summary>${t("lane.more")}</summary><div class="meta" data-laneid></div><div class="detail">${esc(lane.last)}</div></details>`;
  if (lane && lane.summary) html += `<div class="detail">${esc(lane.summary)}</div>`;
  if (hand && hand.kind === "alert" && openBot === "main" && hand.alert.kind === "turn") html += `<div class="meta" style="margin-top:8px">${HAND(16)} ${t("pop.chat")}</div>`;
  else if (hand && hand.kind === "alert") html += `<div class="alert ${esc(hand.alert.kind)}" style="margin-top:8px"><div class="head">${HAND(16)} ${t("kind." + hand.alert.kind)}</div>${alertBody(hand.alert, 0, "p")}</div>`;
  else if (hand) html += `<div class="warn">${t("pop.blocked")}</div>`;
  else if (!lane) html += `<div class="meta">${t("pop.idle")}</div>`;
  html += "</div>";
  if (pop.dataset.html !== html) { pop.innerHTML = html; pop.dataset.html = html; if (hand && hand.kind === "alert" && !(openBot === "main" && hand.alert.kind === "turn")) wireAlerts(pop, [hand.alert], "p") }
  // Filled after the redraw check: they change every tick, and a redraw would wipe what the dev
  // was marking in the card's question.
  const w = pop.querySelector("[data-when]"); if (w) w.textContent = when ? " · " + when : "";
  const li = pop.querySelector("[data-laneid]"); if (li && lane) li.textContent = t("lane.id", { id: String(lane.agent).slice(0, 12), tools: lane.tools, ago: ago(lane.seen) });
  pop.querySelector("[data-close-pop]").onclick = () => pickBot(openBot);
}

// The purpose as written, minus the template: comments, the title line and empty sections.
function purposeText(d) {
  const lines = (d.purpose || "").replace(/<!--.*?-->/gs, "").split("\n").slice(1);
  const out = [];
  lines.forEach((l, i) => {
    if (/^#+\s/.test(l)) {
      const rest = lines.slice(i + 1), next = rest.findIndex(x => /^#+\s/.test(x));
      if (!(next < 0 ? rest : rest.slice(0, next)).some(x => x.trim())) return;
    }
    out.push(l);
  });
  return out.join("\n").replace(/\n{3,}/g, "\n\n").trim().split("\n").slice(0, 30).join("\n");
}
// A ruling of ledger.md: the protocol's English keys become labels in the dev's language.
function rulingHTML(r) {
  const parts = String(r).replace(/^Ruling:\s*/, "").split(/\s*\|\s*/);
  const label = (p) => { const m = /^(why|cost if wrong):\s*(.*)$/i.exec(p); return m ? `<span class="meta">${t(m[1].toLowerCase() === "why" ? "ruling.why" : "ruling.cost")}</span> ${esc(m[2])}` : esc(p) };
  return `<div><b>${esc(parts[0])}</b>${parts.slice(1).map(p => ` · ${label(p)}`).join("")}</div>`;
}


// The worktree's switches: answering questions on the page, and sending the session its next
// message on the page. Turning one on or off asks first, saying what changes and the risk.
function switchesLine(wt) {
  const sw = switchesOf(wt);
  const one = (name) => `<button type="button" class="switch${sw[name] ? " on" : ""}" data-switch="${name}" data-wt="${wt}" data-on="${sw[name] ? 0 : 1}" title="${esc(t("switch.about." + name))}"><i></i>${t("switch.label." + name)}: <b>${t(sw[name] ? "switch.on" : "switch.off")}</b></button>`;
  return `<div class="switches"><span class="meta">${t("switch.title")}</span>${one("answers")}${one("turns")}</div>`;
}
document.addEventListener("click", (ev) => {
  const b = ev.target.closest && ev.target.closest("[data-switch]");
  if (!b) return;
  const name = b.dataset.switch, wt = +b.dataset.wt, on = b.dataset.on === "1";
  const dlg = $("dlg");
  dlg.innerHTML = `<h3>${t("switch.confirm.title." + (on ? "on" : "off"), { what: t("switch.label." + name) })}</h3>
    <div>${t("switch.about." + name)}</div>${on ? `<div class="warn" style="margin-top:8px">${t("switch.risk")}</div>` : ""}
    <div id="switch-msg"></div><div class="actions"><button class="primary" id="switch-go">${t(on ? "switch.do.on" : "switch.do.off")}</button><button data-close>${t("clean.cancel")}</button></div>`;
  if (!dlg.open) dlg.showModal();
  dlg.querySelector("[data-close]").onclick = () => dlg.close();
  $("switch-go").onclick = async () => {
    $("switch-go").disabled = true;
    const r = await post("api/switch", { wt, name, on });
    if (r.ok) { dlg.close(); attnSig = ""; tick() } else { $("switch-msg").innerHTML = await errorText(r); $("switch-go").disabled = false }
  };
});

// Mark as done: the same marker as `work.sh done <ID>`, after a confirmation.
function openClose(d, wt) {
  const dlg = $("dlg"), warns = [];
  if (d.status === "FAIL" || d.stages.some(s => s.verdict === "FAIL")) warns.push(t("close.warn.fail"));
  if (d.findings_open > 0) warns.push(t("close.warn.open-findings", { n: d.findings_open }));
  if (d.status === "running") warns.push(t("close.warn.running"));
  dlg.innerHTML = `<h3>${t("close.title", { id: d.id })}</h3><div class="meta">${t("close.intro", { id: d.id })}</div>${warns.map(w => `<div class="bad">${w}</div>`).join("")}
    <div id="close-msg"></div><div class="actions"><button class="primary" id="close-go">${t("close.confirm")}</button><button data-close>${t("clean.cancel")}</button></div>`;
  if (!dlg.open) dlg.showModal();
  dlg.querySelector("[data-close]").onclick = () => dlg.close();
  $("close-go").onclick = async () => {
    $("close-go").disabled = true;
    const r = await post("api/close", { wt, id: d.id });
    if (r.ok) { $("close-msg").innerHTML = `<div class="ok">${t("close.ok")}</div><div class="actions"><button id="close-clean" class="danger">${t("clean.button")}</button></div>`; $("close-clean").onclick = () => openCleanup(`wt=${wt}&id=${encodeURIComponent(d.id)}`, false) }
    else { $("close-msg").innerHTML = await errorText(r); $("close-go").disabled = false }
    tick();
  };
}

// Cleanup: the server computes the plan and its hash; the page posts the hash and, per task,
// only items the plan offered and did not refuse; a plan that changed is refused (409).
let cleanPlan = null;
const ITEMS = ["state", "worktree", "memory"];
const ul = (xs) => xs && xs.length ? `<ul>${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
const field = (key, xs) => xs && (!Array.isArray(xs) || xs.length) ? `<div class="meta">${t("clean.key." + key)}</div>${ul(Array.isArray(xs) ? xs : [xs])}` : "";
function itemBody(k, it) {
  if (k === "state") return field("paths", it.paths) + (it.cancels_memory_request ? `<div class="warn">${t("clean.cancels.memory")}</div>` : "");
  if (k === "worktree") {
    const ign = it.ignored || [], n = it.ignored_count || ign.length;
    return field("path", it.path) + (it.delete_branch === false ? `<div class="meta">${t("clean.key.branch.kept", { branch: it.branch })}</div>` : field("branch", it.branch)) +
      field("tasks", it.tasks) + (n ? `<details><summary>${t("clean.key.ignored", { n })}</summary>${ul(ign)}</details>` : "") +
      (it.sensitive && it.sensitive.length ? `<div class="bad">${t("clean.key.sensitive")}</div>${ul(it.sensitive)}` : "");
  }
  return field("request", it.request) + field("session_worktree", it.session_worktree) + field("session_worktree_if_removed", it.session_worktree_if_removed);
}
async function openCleanup(query, all) {
  const dlg = $("dlg");
  dlg.innerHTML = `<h3>${t(all ? "clean.title.all" : "clean.title")}</h3><div class="meta">${t("clean.loading")}</div>`;
  if (!dlg.open) dlg.showModal();
  let plan;
  try { plan = await getJSON("api/cleanup-plan?" + query) } catch (e) {
    dlg.innerHTML = `<h3>${t("clean.title")}</h3><div class="bad">${t("dashboard.error", { msg: e.message })}</div><div class="actions"><button data-close>${t("clean.cancel")}</button></div>`;
    dlg.querySelector("[data-close]").onclick = () => dlg.close();
    return;
  }
  cleanPlan = plan;
  const targets = (plan && plan.targets) || [];
  const reason = (r) => has("refuse." + r) ? t("refuse." + r) : esc(r);
  const html = targets.map((g, n) => {
    const head = `<b>${esc(g.worktree || "")}</b> · ${esc(g.id)}${g.retro === false ? `<div class="warn">${t("clean.no-retro")}</div>` : ""}`;
    if (g.refused) return `<div class="target">${head}<div class="bad">${t("clean.refused", { reason: "" })}${reason(g.refused)}</div></div>`;
    const items = g.items || {};
    return `<div class="target">${head}` + ITEMS.filter(k => items[k]).map(k => {
      const it = items[k];
      const recreate = it.recreate && (!it.refused || it.refused === "dirty") ? `<div class="meta">${t("clean.recreate")}</div>${cmdBlock(it.recreate)}` : "";
      if (it.refused) return `<label><input type="checkbox" disabled> ${t("clean.item." + k)}</label><div class="bad">${t("clean.refused", { reason: "" })}${reason(it.refused)}</div>${it.refused === "sensitive-files" ? itemBody(k, it) : ""}${it.refused === "unpushed" || it.refused === "no-remote-branch" ? `<div class="meta">${t("refuse.hand")}</div>` : ""}${recreate}`;
      return `<label><input type="checkbox" data-t="${n}" data-item="${k}"${k === "state" ? " checked" : ""}> ${t("clean.item." + k)}</label>` +
        (k === "memory" ? `<div class="meta">${t("clean.item.memory.m")}</div>` : "") + itemBody(k, it) + recreate;
    }).join("") + `</div>`;
  }).join("") || `<div class="meta">${t("clean.empty")}</div>`;
  const offered = targets.some(g => !g.refused && ITEMS.some(k => g.items && g.items[k] && !g.items[k].refused));
  dlg.innerHTML = `<h3>${t(all ? "clean.title.all" : "clean.title")}</h3><div class="meta">${t("clean.intro")}</div>${html}
    <div id="clean-msg"></div><div class="actions">${offered ? `<button class="danger" id="clean-go">${t("clean.confirm")}</button>` : ""}<button data-close>${t("clean.cancel")}</button></div>`;
  dlg.querySelector("[data-close]").onclick = () => dlg.close();
  if ($("clean-go")) $("clean-go").onclick = () => postCleanup(dlg);
}
async function postCleanup(dlg) {
  const msg = $("clean-msg"), targets = cleanPlan.targets || [];
  const picked = targets.map((g, n) => ({ wt: g.wt, id: g.id,
    items: [...dlg.querySelectorAll(`input[data-t="${n}"]:checked`)].map(x => x.dataset.item).filter(k => ITEMS.includes(k) && g.items && g.items[k] && !g.items[k].refused) }));
  if (!picked.some(g => g.items.length)) { msg.innerHTML = `<div class="bad">${t("clean.none.checked")}</div>`; return }
  dlg.querySelectorAll("button,input").forEach(i => i.disabled = true);
  const r = await post("api/cleanup", { targets: picked, plan: cleanPlan.plan });
  if (r.ok) {
    let res = null;
    try { res = await r.json() } catch (e) {}
    const failed = ((res && res.results) || []).filter(x => !x.ok);
    const why = (e) => has("err." + e) ? t("err." + e) : has("refuse." + e) ? t("refuse." + e) : esc(e);
    msg.innerHTML = failed.length ? `<div class="bad">${t("clean.partial")}</div><ul>${failed.map(x => `<li>${esc(x.id)} · ${t("clean.item." + x.item)}: ${why(x.error)}</li>`).join("")}</ul>` : `<div class="ok">${t("clean.ok")}</div>`;
  } else msg.innerHTML = await errorText(r);
  dlg.querySelector("[data-close]").disabled = false;
  tick();
}

// Notifications: browsers ignore a permission request that no click started, so the button asks.
function notifyState() {
  const btn = $("notify-btn"), st = $("notify-state");
  btn.textContent = t("notify.enable");
  if (!("Notification" in window)) { btn.hidden = true; st.textContent = t("notify.unsupported"); return }
  const p = Notification.permission;
  btn.hidden = p !== "default";
  st.textContent = p === "granted" ? t("notify.on") : p === "denied" ? t("notify.blocked") : t("notify.off");
}
$("notify-btn").onclick = () => {
  if (!("Notification" in window)) return notifyState();
  Promise.resolve(Notification.requestPermission()).then(notifyState, notifyState);
  unlockAudio();
};
// Sound: a short beep for each new alert, muted by a toggle the browser remembers.
let muted = false, audio = null;
try { muted = localStorage.getItem(MUTE_KEY) === "1" } catch (e) {}
function muteLabel() { $("mute-btn").textContent = muted ? t("sound.off") : t("sound.on") }
$("mute-btn").onclick = () => { muted = !muted; try { localStorage.setItem(MUTE_KEY, muted ? "1" : "0") } catch (e) {} muteLabel(); unlockAudio() };
function unlockAudio() {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume() } catch (e) { audio = null }
}
document.addEventListener("click", unlockAudio);
// A two-note chime (a rising fifth) with a soft attack and a ring that fades: it says "something
// needs you" without the alarm of a bare beep.
function beep() {
  if (muted) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const out = audio.createGain(), t0 = audio.currentTime;
    out.gain.value = 0.18;
    out.connect(audio.destination);
    [[880, 0], [1318.5, 0.14]].forEach(([freq, at]) => {
      [[1, "sine", 1], [2, "sine", 0.18], [3, "triangle", 0.06]].forEach(([mult, type, level]) => {
        const osc = audio.createOscillator(), g = audio.createGain(), start = t0 + at;
        osc.type = type; osc.frequency.value = freq * mult;
        g.gain.setValueAtTime(0.0001, start);
        g.gain.linearRampToValueAtTime(level, start + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, start + 1.1 / mult);
        osc.connect(g).connect(out); osc.start(start); osc.stop(start + 1.2);
      });
    });
  } catch (e) {}
}

// Live updates: the server's event stream; when it is refused or drops, a 2 s poll.
let live = false, poll = null, connecting = true, stream = null;
function liveLabel() { const el = $("live"); el.className = "live" + (live ? "" : " off"); el.innerHTML = `<i></i>${t(live ? "live.on" : connecting ? "live.connecting" : "live.off")}` }
function startPoll() { if (!poll) poll = setInterval(tick, 2000) }
function connect() {
  if (!("EventSource" in window)) { startPoll(); return }
  // The stream takes the page's token: another site cannot hold its connections.
  if (stream) stream.close();
  const es = stream = new EventSource(scoped("api/events?t=" + encodeURIComponent(TOKEN)));
  es.addEventListener("hello", () => { live = true; connecting = false; liveLabel(); if (poll) { clearInterval(poll); poll = null } });
  es.addEventListener("change", () => tick());
  es.onerror = () => { es.close(); live = false; connecting = false; liveLabel(); startPoll() };
}

// A page coming back into view says so at once: only a page in view keeps a hold for the page.
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") tick() });
window.addEventListener("hashchange", () => { openFile = null; openBot = null; tick() });

applyLang();
tick(); connect();
// A slow heartbeat refresh keeps "ago" times and live alerts fresh even with the stream up.
setInterval(() => { if (live) tick() }, 15000);
</script>
</body>
